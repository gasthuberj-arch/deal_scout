# fly.toml app configuration file generated for deal_scout
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "deal-scout"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_SERVER = "true"
  DATABASE_PATH = "/data/deal_scout.db"
  PORT = "8080"

[mounts]
  source = "deal_scout_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 800

[deploy]
  strategy = "immediate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
