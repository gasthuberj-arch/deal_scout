# fly.toml app configuration file generated for deal_scout
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "deal-scout"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  PHX_SERVER = "true"
  DATABASE_PATH = "/data/deal_scout.db"
  PORT = "8080"
  MALLOC_ARENA_MAX = "2"
  ERL_AFLAGS = "+sbwt none +sbwtdcpu none +sbwtdio none"

[mounts]
  source = "deal_scout_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 300
    soft_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[metrics]
  port = 9091
  path = "/metrics"

[deploy]
  strategy = "immediate"
  release_command = "/app/bin/migrate"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  swap_size_mb = 512
