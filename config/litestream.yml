# Litestream continuous replication configuration for DealScout
# Replicates SQLite WAL frames to a local file replica directory.
# This directory is indexed and streamed down to your NixOS NAS via Phoenix WebSockets.

dbs:
  - path: "${DATABASE_PATH:-/data/deal_scout.db}"
    replicas:
      - type: file
        path: "${LITESTREAM_REPLICA_PATH:-/data/litestream}"
        # Keep 48h of snapshots/WAL on server to prevent filling the 1GB Fly volume:
        retention: "${LITESTREAM_RETENTION:-48h}"
        retention-check-interval: "1h"
        snapshot-interval: "${LITESTREAM_SNAPSHOT_INTERVAL:-24h}"
